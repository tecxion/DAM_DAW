<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<title>EjemploBotón</title>
		<script>
			function funcion() {
				document.getElementById("parrafo").innerHTML = "Modifica contenido";
			}
		</script>
	</head>
	<body>
		<p id="parrafo">Este texto se modificará cuando pulsemos el botón</p>
		<button type="button" onclick="funcion()">Pulsa aquí</button>
	</body>
</html>
