<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<title>EjemploRemove</title>
		<script>
			function funcion() {
				const elemento = document.getElementById("parrafo");
				elemento.remove();
			}
		</script>
	</head>
	<body>
		<p id="parrafo">Este texto que desaparecerá cuando pulsemos el botón</p>
		<button type="button" onclick="funcion()">Pulsa aquí</button>
	</body>
</html>
