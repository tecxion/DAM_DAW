<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<title>EjemploVisualización</title>
		<script type='text/javascript' src='./javascript/LibreriaJavaScript.js'></script>
	</head>
	<body>
		<p id="parrafo">Este texto que desaparecerá cuando pulsemos el botón "Ocultar"</p>
		<button type="button" onclick="ocultar('parrafo')" value="Ocultar">Ocultar</button>
		<button type="button" onclick="mostrar('parrafo')" value="Mostrar">Mostrar</button>
	</body>
</html>
