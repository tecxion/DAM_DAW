<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<title>EjemploMensajes</title>
		<script type='text/javascript' src='./javascript/LibreriaJavaScript.js'></script>
	</head>
	<body>
		Introduzca un texto: <input type="text" value="Escriba aquí un texto..." id="texto"/> 
		<button type="button" onclick="mostrarValor('texto')" value="valor">Mostrar texto dinámico</button><br/><br/>

		<button type="button" onclick="mostrarFecha()" value="MostrarF">Mostrar fecha y hora</button>
		<button type="button" onclick="mostrarFechaFormateada()" value="MostrarFF">Mostrar fecha formateada</button>
	</body>
